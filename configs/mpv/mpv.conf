# GT 420 + nouveau: a placa não decodifica vídeo (falta firmware) e o OpenGL dela é fraco.
# O processador decodifica (sobra muito) e o xv só põe a imagem na tela.
# Testado em 13/10/2026: filme 1080p em tela cheia, 0 quadros perdidos.
vo=xv
hwdec=no
# Áudio e legenda em português quando o arquivo tiver
alang=por,pt,pt-BR
slang=por,pt,pt-BR
# Continua de onde parou
save-position-on-quit
# YouTube (Super+Y): H.264 até 1080p, que é o mais leve; sem H.264, qualquer um menos AV1.
# Testado em 30/10/2026: 1080p60 H.264 e VP9 decodificam mais rápido que o tempo real com o Chrome aberto.
ytdl-format=bv*[height<=1080][vcodec^=avc1]+ba/bv*[height<=1080][vcodec!^=av01]+ba/b[height<=1080]/b
